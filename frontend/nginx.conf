map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# OAuth callbacks contain short-lived codes and state in the query string.
# Log only the request path and omit Referer so those values never reach logs.
log_format privacy '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 8080;
    server_name localhost;
    # A server-level access_log overrides the base image's inherited combined
    # logger, which otherwise records both the query string and Referer.
    access_log /var/log/nginx/access.log privacy;
    root /usr/share/nginx/html;
    index index.html;

    add_header Referrer-Policy "no-referrer" always;

    # index.html (and any other un-hashed html) must never be cached by the
    # browser — it references content-hashed JS/CSS bundle names, and a
    # stale copy in the browser cache keeps loading an old build's JS
    # against the current backend (this is what caused Chrome to show
    # "Loading live jobs..." / "No active jobs" while Firefox/incognito,
    # which weren't holding a stale cached copy, worked fine).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed files beneath /assets/, so these can be cached
    # indefinitely. Restrict the immutable policy to that directory: files
    # copied from public/ keep stable names and must remain revalidatable.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Exact match for the bare jobs-list endpoint (no trailing slash).
    # Without this, the prefix location below — which ends in "/" and
    # uses proxy_pass — makes nginx auto-redirect this URI with a 301
    # to "<scheme>://<host>:<server_port>/.../jobs/", using nginx's own
    # (plain-HTTP, port 8080) view of itself rather than the real
    # HTTPS route the browser is on. That redirect gets blocked by the
    # browser as mixed content, so the jobs list silently fails to load.
    # See: https://nginx.org/en/docs/http/ngx_http_core_module.html#location
    location = /api/v1/fournos/jobs {
        proxy_pass http://psap-control-center-backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    # SSE log streaming for fournos jobs (unbuffered, long timeout)
    location /api/v1/fournos/jobs/ {
        proxy_pass http://psap-control-center-backend:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    location /api {
        proxy_pass http://psap-control-center-backend:8000;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}
