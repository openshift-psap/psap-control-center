services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pasp-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./kubeconfigs:/app/kubeconfigs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/pasp_control_center.db
      - KUBECONFIG_STORAGE_PATH=/app/kubeconfigs
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-admin-password}
      - USER_USERNAME=${USER_USERNAME:-user}
      - USER_PASSWORD=${USER_PASSWORD:-change-user-password}
      - LOCAL_LOGIN_ENABLED=${LOCAL_LOGIN_ENABLED:-true}
      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN:-}
      - GOOGLE_ADMIN_EMAILS=${GOOGLE_ADMIN_EMAILS:-}
      - HEARTH_ENABLED=${HEARTH_ENABLED:-true}
      - HEARTH_NAMESPACE=${HEARTH_NAMESPACE:-hearth}
      - FOURNOS_NAMESPACE=${FOURNOS_NAMESPACE:-psap-automation}
      - FOURNOS_API_GROUP=${FOURNOS_API_GROUP:-fournos.dev}
      - FOURNOS_API_VERSION=${FOURNOS_API_VERSION:-v1}
      - FOURNOS_JOB_PLURAL=${FOURNOS_JOB_PLURAL:-fournosjobs}
      - FOURNOS_K8S_TIMEOUT=${FOURNOS_K8S_TIMEOUT:-30}
      - FORGE_GITHUB_REPO=${FORGE_GITHUB_REPO:-openshift-psap/forge}
      - FORGE_GITHUB_REF=${FORGE_GITHUB_REF:-main}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_SYNC_INTERVAL_SECONDS=${GITHUB_SYNC_INTERVAL_SECONDS:-3600}
      - GITHUB_SYNC_FAILURE_BACKOFF_SECONDS=${GITHUB_SYNC_FAILURE_BACKOFF_SECONDS:-300}
      - FOURNOS_DEFAULT_PIPELINES=${FOURNOS_DEFAULT_PIPELINES:-forge-full,forge-prepare-test,forge-test-only,forge-prepare-only,forge-replot,nightly}
      - BILLING_CSV_STORAGE_PATH=/app/data/billing_csvs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pasp-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
