name: Prod Build & Push

"on":
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: quay.io/redhat-performance/psap-control-center-backend:latest
  FRONTEND_IMAGE: quay.io/redhat-performance/psap-control-center-frontend:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_CONTROL_CENTER_USERNAME }}
          password: ${{ secrets.QUAY_CONTROL_CENTER_PASSWORD }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          platforms: linux/amd64

      - name: Create frontend Dockerfile
        run: |
          printf '%s\n' \
            'FROM nginxinc/nginx-unprivileged:alpine' \
            'COPY dist /usr/share/nginx/html' \
            'COPY nginx.conf /etc/nginx/conf.d/default.conf' \
            'EXPOSE 8080' \
            'CMD ["nginx", "-g", "daemon off;"]' \
            > /tmp/Dockerfile.frontend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: /tmp/Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          platforms: linux/amd64
