apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-updater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-updater
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-updater
subjects:
- kind: ServiceAccount
  name: image-updater
roleRef:
  kind: Role
  name: image-updater
  apiGroup: rbac.authorization.k8s.io
